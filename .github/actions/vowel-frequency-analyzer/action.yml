name: 'Vowel Frequency Analyzer'
description: 'Custom action to analyze vowel frequency in given file'

inputs:
  file:
    description: 'The path to the text file to analyze'
    required: true

runs:
  using: 'docker'
  image: 'ghcr.io/kdandy1/vowel-frequency-analyzer:latest'
  entrypoint: ['/bin/bash', '/github/scripts/entrypoint.sh']
  env:
    FILE: ${{ inputs.file }}